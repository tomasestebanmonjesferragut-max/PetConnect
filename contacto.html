<form id="formContacto" class="form" novalidate>
          <label>Nombre
            <input type="text" name="nombre" required>
          </label>
          <label>Correo
            <input type="email" name="correo" required>
          </label>
          <label>Mascota de interés
            <select name="mascota" id="selectMascota" required>
              <option value="">Selecciona...</option>
              <!-- Las opciones se llenarán con JS -->
            </select>
          </label>
          <label>Mensaje
            <textarea name="mensaje" rows="4" required></textarea>
          </label>
          
          <!-- Simulación de "No soy robot" -->
          <label class="check">
            <input type="checkbox" name="robot" required>
            🤖 No soy un robot
          </label>

          <p id="errores" class="errores"></p>
          <button type="submit" class="btn">Enviar</button>
          
          <!-- Mensaje de éxito oculto por defecto -->
          <p id="exito" class="exito" hidden></p>
        </form>
